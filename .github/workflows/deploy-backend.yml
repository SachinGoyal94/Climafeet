name: Deploy backend to Azure

# Needs a repo secret AZURE_WEBAPP_PUBLISH_PROFILE (download it from the App Service
# overview page) and a repo variable AZURE_WEBAPP_NAME.
on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
